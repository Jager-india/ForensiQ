<c-vars
    title="Suspected Middlemen Passing Money"
/>

<div class="bg-theme-surface rounded-2xl border border-theme-border shadow-sm mb-8 overflow-hidden transition-all"
     x-data="{
         isExpanded: false,
         priorityModel: 'composite',
         expandedConduit: null,
         get sortedConduits() {
             const items = [...(window.conduitDeckData || [])];
             if (this.priorityModel === 'value') {
                 return items.sort((a, b) => (b.scores?.value ?? 0) - (a.scores?.value ?? 0));
             } else if (this.priorityModel === 'velocity') {
                 return items.sort((a, b) => (b.scores?.velocity ?? 0) - (a.scores?.velocity ?? 0));
             }
             return items.sort((a, b) => (b.scores?.composite ?? 0) - (a.scores?.composite ?? 0));
         },
         toggle(id) {
             this.expandedConduit = (this.expandedConduit === id) ? null : id;
         },
         loadingConduits: new Set(),
         async addConduitKeyword(c) {
             if (c.is_keyword_added) return;
             this.loadingConduits.add(c.id);
             try {
                 const csrfToken = (typeof window.getCookie === 'function' ? window.getCookie('csrftoken') : '') || document.querySelector('[name=csrfmiddlewaretoken]')?.value || '';
                 const sender = (c.sender || '').toLowerCase();
                 const recipient = (c.recipient || '').toLowerCase();
                 const matchedP = (window.analyzedProfilesData || []).find(p =>
                     (p.name && (p.name.toLowerCase() === sender || p.name.toLowerCase() === recipient))
                 );
                 const profileId = matchedP?.id || (window.analyzedProfilesData && window.analyzedProfilesData[0]?.id) || (window.beatsData && window.beatsData[0] && window.beatsData[0].profile_id) || '';
                 const res = await fetch('{% url 'q_trail:add_counterparty_keyword' %}', {
                     method: 'POST',
                     headers: {
                         'Content-Type': 'application/json',
                         'X-CSRFToken': csrfToken,
                     },
                     body: JSON.stringify({
                         profile_id: profileId,
                         keyword: c.name,
                     })
                 });
                 const data = await res.json();
                 if (data.status === 'success') {
                     c.is_keyword_added = true;
                     window.dispatchEvent(new CustomEvent('counterparty-keyword-added', {
                         detail: { name: c.name, profileId: profileId }
                     }));
                 } else {
                     alert(data.message || 'Failed to add keyword.');
                 }
             } catch (err) {
                 console.error('Failed adding conduit keyword:', err);
             } finally {
                 this.loadingConduits.delete(c.id);
             }
         }
     }"
     @counterparty-keyword-added.window="
         const name = ($event.detail?.name || '').toLowerCase();
         if (name) {
             (window.conduitDeckData || []).forEach(item => {
                 if (item.name && item.name.toLowerCase() === name) {
                     item.is_keyword_added = true;
                 }
             });
         }
     ">

    <!-- Header Bar: Click to Expand / Collapse -->
    <button type="button" @click="isExpanded = !isExpanded"
        class="w-full flex items-center justify-between p-5 text-left cursor-pointer hover:bg-theme-subtle transition select-none">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-500 flex items-center justify-center text-sm">
                <i class="fa-solid fa-user-secret"></i>
            </div>
            <div>
                <h3 class="text-base font-bold text-theme-text flex items-center gap-2">
                    <span>{{ title }}</span>
                    <span class="text-xs font-mono px-2 py-0.5 rounded bg-theme-subtle text-theme-muted font-normal"
                          x-text="(window.conduitDeckData || []).length + ' Middlemen'"></span>
                </h3>
                <p class="text-xs text-theme-muted mt-0.5">
                    {{ subtitle }}
                </p>
            </div>
        </div>

        <!-- Dropdown / Caret Icon -->
        <div class="flex items-center gap-2 text-theme-muted">
            <i class="fa-solid fa-chevron-down text-sm transition-transform duration-200"
                :class="{ 'rotate-180': isExpanded }"></i>
        </div>
    </button>

    <!-- Collapsible Content Body -->
    <div x-show="isExpanded" x-cloak class="p-5 pt-0 border-t border-theme-border space-y-4">
        <!-- Priority Model Segmented Switcher -->
        <div class="flex items-center justify-end gap-1.5 p-1 pt-4 self-end text-xs font-semibold">
            <span class="text-[11px] text-theme-muted px-2 select-none">Sort By:</span>
            <button type="button" @click="priorityModel = 'composite'"
                    :class="priorityModel === 'composite' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-theme-muted hover:text-theme-text border border-theme-border'"
                    class="px-2.5 py-1 rounded-lg transition cursor-pointer">
                Overall Risk
            </button>
            <button type="button" @click="priorityModel = 'value'"
                    :class="priorityModel === 'value' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-theme-muted hover:text-theme-text border border-theme-border'"
                    class="px-2.5 py-1 rounded-lg transition cursor-pointer">
                Highest Cut Kept
            </button>
            <button type="button" @click="priorityModel = 'velocity'"
                    :class="priorityModel === 'velocity' ? 'bg-amber-500/10 text-amber-500 border border-amber-500/30' : 'text-theme-muted hover:text-theme-text border border-theme-border'"
                    class="px-2.5 py-1 rounded-lg transition cursor-pointer">
                Fastest Hand-off
            </button>
        </div>

    <!-- Conduit Cards Deck -->
    <div class="space-y-3">
        <template x-for="(c, idx) in sortedConduits" :key="c.id">
            <div class="border rounded-xl transition-all overflow-hidden"
                 :class="expandedConduit === c.id ? 'border-amber-500/60 bg-amber-500/5 shadow-sm' : 'border-theme-border hover:border-theme-border-strong bg-theme-surface'">

                <!-- Card Header Button -->
                <button type="button" @click="toggle(c.id)"
                        class="w-full text-left p-3.5 flex flex-wrap items-center justify-between gap-3 cursor-pointer select-none">
                    <!-- Left: Rank & Conduit Identity -->
                    <div class="flex items-center gap-3 min-w-[200px]">
                        <span class="w-6 h-6 rounded-lg bg-theme-subtle text-theme-text font-mono text-xs font-bold flex items-center justify-center"
                              x-text="idx + 1"></span>
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs sm:text-sm text-theme-text" x-text="c.name"></span>
                                <template x-if="c.is_loop">
                                    <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-bold bg-rose-500/10 text-rose-500 border border-rose-500/20 font-mono">
                                        <i class="fa-solid fa-arrows-spin text-[9px]"></i> Loop Closer
                                    </span>
                                </template>
                            </div>
                            <div class="text-[11px] text-theme-muted mt-0.5 font-mono">
                                <span x-text="c.sender"></span> &rarr; <span class="text-amber-500 font-bold" x-text="c.name"></span> &rarr; <span x-text="c.recipient"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Middle: Risk Score Bar -->
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <div class="text-xs font-bold font-mono"
                                 :class="c.scores.composite >= 70 ? 'text-rose-400' : (c.scores.composite >= 40 ? 'text-amber-400' : 'text-theme-muted')"
                                 x-text="c.scores[priorityModel] + ' pts'"></div>
                            <div class="w-20 bg-theme-subtle h-1.5 rounded-full overflow-hidden mt-1">
                                <div class="h-full rounded-full transition-all"
                                     :class="c.scores.composite >= 70 ? 'bg-rose-500' : 'bg-amber-500'"
                                     :style="'width: ' + c.scores[priorityModel] + '%'"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Key Numbers & Chevron -->
                    <div class="flex items-center gap-4 text-xs font-mono">
                        <div class="text-right">
                            <div class="font-bold text-amber-500 dark:text-amber-400" x-text="c.retained_short"></div>
                            <div class="text-[10px] text-theme-muted font-sans" x-text="'retained · ' + c.retention_pct + '%'"></div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-theme-text" x-text="c.delta_days === 0 ? 'same day' : c.delta_days + 'd'"></div>
                            <div class="text-[10px] text-theme-muted font-sans">&Delta; transit time</div>
                        </div>
                        <span class="text-theme-muted transition-transform duration-200"
                              :class="expandedConduit === c.id ? 'rotate-90' : ''">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </span>
                    </div>
                </button>

                <!-- Expanded Body -->
                <div x-show="expandedConduit === c.id" x-collapse x-cloak
                     class="px-4 pb-4 pt-2 border-t border-theme-border bg-theme-subtle/20 text-xs">

                    <!-- Visual Hop Map Lane -->
                    <div class="flex items-center justify-between p-3 my-2 rounded-xl bg-theme-surface border border-theme-border font-mono text-xs overflow-x-auto">
                        <div class="text-center min-w-[100px]">
                            <span class="font-bold text-theme-text" x-text="c.sender"></span>
                            <div class="text-[10px] text-theme-muted">Origin Auditee</div>
                        </div>
                        <div class="flex flex-col items-center px-4">
                            <span class="text-[11px] font-bold text-emerald-400" x-text="c.outflow_short + ' out'"></span>
                            <div class="w-24 sm:w-32 h-0.5 bg-emerald-500/60 relative my-1">
                                <i class="fa-solid fa-caret-right text-emerald-400 absolute -right-1.5 -top-2 text-xs"></i>
                            </div>
                            <span class="text-[10px] text-theme-muted" x-text="c.outflow_date"></span>
                        </div>
                        <div class="text-center min-w-[120px] px-2 py-1 rounded bg-amber-500/10 border border-amber-500/30">
                            <span class="font-bold text-amber-500" x-text="c.name"></span>
                            <div class="text-[10px] text-amber-500/80 font-sans">1-Hop Intermediary</div>
                        </div>
                        <div class="flex flex-col items-center px-4">
                            <span class="text-[11px] font-bold text-sky-400" x-text="c.inflow_short + ' forwarded'"></span>
                            <div class="w-24 sm:w-32 h-0.5 bg-sky-500/60 relative my-1">
                                <i class="fa-solid fa-caret-right text-sky-400 absolute -right-1.5 -top-2 text-xs"></i>
                            </div>
                            <span class="text-[10px] text-amber-400/90" x-text="c.retained_short + ' kept (' + c.retention_pct + '%)'"></span>
                        </div>
                        <div class="text-center min-w-[120px]">
                            <span class="font-bold text-theme-text" x-text="c.recipient"></span>
                            <div class="text-[10px] text-theme-muted">Recipient Sink(s)</div>
                        </div>
                    </div>

                    <!-- 4-Column Metric Summary -->
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 my-3">
                        <div class="p-2.5 rounded-lg bg-theme-surface border border-theme-border">
                            <span class="text-[10px] text-theme-muted block">Total Dispatched</span>
                            <strong class="text-xs font-mono text-theme-text" x-text="c.outflow_short"></strong>
                        </div>
                        <div class="p-2.5 rounded-lg bg-theme-surface border border-theme-border">
                            <span class="text-[10px] text-theme-muted block">Total Forwarded</span>
                            <strong class="text-xs font-mono text-theme-text" x-text="c.inflow_short"></strong>
                        </div>
                        <div class="p-2.5 rounded-lg bg-amber-500/10 border border-amber-500/20">
                            <span class="text-[10px] text-amber-500 block">Retained Margin</span>
                            <strong class="text-xs font-mono text-amber-500 dark:text-amber-400" x-text="c.retained_short + ' (' + c.retention_pct + '%)'"></strong>
                        </div>
                        <div class="p-2.5 rounded-lg bg-theme-surface border border-theme-border">
                            <span class="text-[10px] text-theme-muted block">Transit Dwell</span>
                            <strong class="text-xs font-mono text-theme-text" x-text="c.delta_days + ' Days'"></strong>
                        </div>
                    </div>

                    <!-- Flags & Tags -->
                    <div class="flex flex-wrap items-center gap-1.5 my-3">
                        <template x-for="(flag, f_idx) in c.flags" :key="f_idx">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-[11px] bg-theme-subtle text-theme-text border border-theme-border">
                                <i class="fa-solid fa-flag text-[9px] text-amber-500"></i>
                                <span x-text="flag"></span>
                            </span>
                        </template>
                    </div>

                    <!-- Action Bar -->
                    <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-theme-border">
                        <div class="flex items-center gap-2">
                            <button type="button"
                                    @click="$dispatch('trace-conduit', { name: c.name })"
                                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-bold text-xs hover:bg-amber-400 transition cursor-pointer">
                                <i class="fa-solid fa-play text-[10px]"></i>
                                <span>Trace this conduit on timeline</span>
                            </button>

                            <template x-if="c.is_keyword_added">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/25 font-bold text-xs">
                                    <i class="fa-solid fa-check text-[10px]"></i>
                                    <span>In Profile Keywords</span>
                                </span>
                            </template>
                            <template x-if="!c.is_keyword_added">
                                <button type="button"
                                        @click="addConduitKeyword(c)"
                                        :disabled="loadingConduits && loadingConduits.has(c.id)"
                                        class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-amber-500/10 text-amber-500 border border-amber-500/30 hover:bg-amber-500 hover:text-slate-950 font-bold text-xs transition cursor-pointer">
                                    <i class="fa-solid" :class="(loadingConduits && loadingConduits.has(c.id)) ? 'fa-spinner fa-spin' : 'fa-plus'"></i>
                                    <span>Add to Profile Keywords</span>
                                </button>
                            </template>
                        </div>
                        <span class="text-[11px] font-mono text-theme-muted">Rule 2 Intermediate Transit</span>
                    </div>
                </div>
            </div>
        </template>
        </div>
    </div>
</div>
